modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Bob325"

description = '''
Command Sequencer is a timeline-based system that allows players to create, visualize, and execute commands with precise timing.

Inspired by music sequencers and event editors, this mod provides a custom GUI where users can place commands along a timeline, control delays, and synchronize events for complex animations, cutscenes, and gameplay mechanics.

It is designed as a modern alternative to command blocks and redstone timers, offering a more intuitive and powerful way to manage command execution.
'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"